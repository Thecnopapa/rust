[package]
name = "mmcif_parser"
version = "0.0.3"
edition = "2024"

[dependencies]
pyo3 = { version = "*", features = ["rust_decimal"] }
regex = "*"
rust_decimal = "*"
write-json = "*"

[lib]
name = "mmcif_parser"
crate-type = ["cdylib"]



[[bin]]
name = "mmcif_parser"
path = "src/base/parser_v2.rs"
